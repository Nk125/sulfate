[build]
rustflags = ["-Ctarget-cpu=native"]

[profile.release]
opt-level = "z"
debug = false
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 8

[profile.dev]
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3
