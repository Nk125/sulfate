[package]
name = "server"
version = "0.1.0"
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2", "tracing", "ws"] }
axum-server = "0.8.0"
dotenv = { package = "dotenv-ng", version = "1.0.0" }
futures = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.151"
sulfate_core = { path = "../sulfate_core" }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
